<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大巴扎职业数据查询工具</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3348;
  --text: #e4e6f0; --text2: #9499b3; --accent: #6c72cb; --accent2: #48c6a9;
  --bronze: #cd7f32; --silver: #c0c0c0; --gold: #ffd700; --diamond: #b9f2ff; --legendary: #ff6b6b;
  --danger: #e74c3c; --warning: #f39c12;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 32px 20px; background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%); border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--border); }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { color: var(--text2); font-size: 14px; }

/* Hero Selector */
.hero-selector { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
.hero-selector h2 { font-size: 18px; margin-bottom: 16px; }
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.hero-card { background: var(--surface2); border: 2px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: all 0.2s; text-align: center; position: relative; }
.hero-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(108,114,203,0.2); }
.hero-card.active { border-color: var(--accent2); background: rgba(72,198,169,0.08); }
.hero-card .name-zh { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
.hero-card .name-en { font-size: 11px; color: var(--text2); }
.hero-card .cache-info { font-size: 10px; color: var(--accent2); margin-top: 6px; }
.hero-card .cache-info.no-cache { color: var(--warning); }

/* Loading Dialog */
.dialog-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; }
.dialog-overlay.active { display: flex; }
.dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 480px; width: 90%; text-align: center; }
.dialog h3 { font-size: 20px; margin-bottom: 8px; }
.dialog .hero-name { font-size: 24px; font-weight: 700; color: var(--accent2); margin: 12px 0; }
.dialog .btn-group { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
.btn { padding: 10px 24px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #5a60b5; }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-secondary:hover { background: var(--border); }
.btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-cancel { background: transparent; color: var(--text2); border-color: var(--border); }
.btn-cancel:hover { color: var(--text); border-color: var(--text2); }

/* Progress */
.progress-area { margin-top: 20px; text-align: left; }
.progress-bar-track { background: var(--surface2); border-radius: 8px; height: 8px; overflow: hidden; margin: 12px 0; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 8px; transition: width 0.3s; }
.progress-text { font-size: 13px; color: var(--text2); min-height: 20px; }
.progress-phase { font-size: 12px; color: var(--accent); margin-top: 4px; }
.progress-log { max-height: 120px; overflow-y: auto; margin-top: 8px; padding: 8px; background: var(--bg); border-radius: 6px; font-size: 11px; color: var(--text2); line-height: 1.6; font-family: monospace; }

/* Content Area */
.content-area { display: none; }
.content-area.active { display: block; }
.back-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.back-btn:hover { background: var(--accent); border-color: var(--accent); }
.data-source { font-size: 12px; color: var(--text2); }

/* Filters */
.filters { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--border); }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filter-row:last-child { margin-bottom: 0; }
.search-box { flex: 1; min-width: 220px; position: relative; }
.search-box input { width: 100%; padding: 9px 12px 9px 36px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
.search-box input:focus { border-color: var(--accent); }
.search-box::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; }
.filter-label { font-size: 12px; color: var(--text2); font-weight: 500; }
.filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-btn { padding: 5px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; font-size: 12px; transition: all 0.2s; }
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sort-select { padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; outline: none; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface); padding: 6px; border-radius: 10px; border: 1px solid var(--border); }
.tab { padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text2); border-radius: 6px; transition: all 0.2s; flex: 1; text-align: center; }
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { color: #fff; background: var(--accent); }
.tab .count { display: inline-block; font-size: 11px; background: rgba(255,255,255,0.2); padding: 1px 7px; border-radius: 10px; margin-left: 6px; }

.stats { padding: 10px 14px; background: var(--surface); border-radius: 8px; margin-bottom: 14px; font-size: 13px; color: var(--text2); border: 1px solid var(--border); }

/* Cards */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; transition: all 0.2s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108,114,203,0.15); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
.card-name { font-size: 15px; font-weight: 600; flex: 1; }
.card-name small { display: block; font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 2px; }
.card-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.badge-tier { color: #fff; }
.badge-tier.bronze { background: var(--bronze); }
.badge-tier.silver { background: #808080; }
.badge-tier.gold { background: #b8960f; }
.badge-tier.diamond { background: #4a9eb5; }
.badge-tier.legendary { background: var(--legendary); }
.badge-size { background: var(--surface2); border: 1px solid var(--border); }
.badge-type { background: var(--surface2); border: 1px solid var(--border); color: var(--accent2); }
.card-tooltip { font-size: 12px; color: var(--accent2); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.card-tooltip .tip-type { font-size: 10px; color: var(--text2); text-transform: uppercase; margin-right: 4px; }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.card-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.card-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 11px; color: var(--text2); margin-top: 6px; }
.card-attrs span b { color: var(--text); font-weight: 500; }
.card-heroes { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.hero-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; }
.card-link { position: absolute; top: 8px; right: 8px; color: var(--text2); text-decoration: none; font-size: 12px; opacity: 0; transition: opacity .2s; }
.card:hover .card-link { opacity: 1; }
.card { position: relative; overflow: hidden; }

.empty { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.loading { text-align: center; padding: 40px; }
.spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
.pulse { animation: pulse 1.5s ease-in-out infinite; }

@media(max-width:768px) {
  .cards-grid { grid-template-columns: 1fr; }
  .hero-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .dialog { padding: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛠️ 大巴扎职业数据查询工具</h1>
    <p>选择职业 → 在线获取全部数据 → 动态搜索筛选</p>
  </div>

  <div id="heroSelector" class="hero-selector">
    <h2>📚 选择职业</h2>
    <div class="hero-grid" id="heroGrid"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <div id="contentArea" class="content-area">
    <div class="back-bar">
      <button class="back-btn" onclick="showHeroSelector()">← 返回职业选择</button>
      <span class="data-source" id="dataSource"></span>
      <button class="back-btn" id="refetchBtn" onclick="refetchCurrent()" style="margin-left:auto">🔄 重新获取</button>
    </div>
    <div class="filters">
      <div class="filter-row">
        <div class="search-box"><input type="text" id="searchInput" placeholder="搜索名称、标签、效果..." oninput="applyFilters()"></div>
        <span class="filter-label">排序:</span>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
          <option value="name">按名称</option><option value="tier">按品质</option><option value="size">按大小</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">范围:</span>
        <div class="filter-group">
          <button class="filter-btn active" id="scopeAll" onclick="setScope('all')">全部</button>
          <button class="filter-btn" id="scopeExclusive" onclick="setScope('exclusive')">仅专属</button>
        </div>
        <span class="filter-label">品质:</span>
        <div class="filter-group">
          <button class="filter-btn" data-tier="铜" onclick="toggleFilter(this,'tier')">铜</button>
          <button class="filter-btn" data-tier="银" onclick="toggleFilter(this,'tier')">银</button>
          <button class="filter-btn" data-tier="金" onclick="toggleFilter(this,'tier')">金</button>
          <button class="filter-btn" data-tier="钻石" onclick="toggleFilter(this,'tier')">钻石</button>
          <button class="filter-btn" data-tier="传说" onclick="toggleFilter(this,'tier')">传说</button>
        </div>
        <span class="filter-label">大小:</span>
        <div class="filter-group">
          <button class="filter-btn" data-size="小型" onclick="toggleFilter(this,'size')">小</button>
          <button class="filter-btn" data-size="中型" onclick="toggleFilter(this,'size')">中</button>
          <button class="filter-btn" data-size="大型" onclick="toggleFilter(this,'size')">大</button>
        </div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="items" onclick="switchTab('items')">物品 <span class="count" id="itemsCount">0</span></div>
      <div class="tab" data-tab="skills" onclick="switchTab('skills')">技能 <span class="count" id="skillsCount">0</span></div>
    </div>
    <div class="stats" id="statsBar"></div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>
</div>

<!-- Hero Selection Dialog -->
<div class="dialog-overlay" id="heroDialog">
  <div class="dialog">
    <h3>选择获取方式</h3>
    <div class="hero-name" id="dialogHeroName"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="startOnlineFetch()">🌐 在线获取全部数据</button>
      <button class="btn btn-secondary" id="useCacheBtn" onclick="useCacheData()">📁 使用本地缓存</button>
    </div>
    <div style="margin-top:12px"><button class="btn btn-cancel" onclick="closeDialog()">取消</button></div>
  </div>
</div>

<!-- Progress Dialog -->
<div class="dialog-overlay" id="progressDialog">
  <div class="dialog">
    <h3 id="progressTitle">正在获取数据</h3>
    <div class="hero-name" id="progressHeroName"></div>
    <div class="progress-area">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">准备中...</div>
      <div class="progress-phase" id="progressPhase"></div>
      <div class="progress-log" id="progressLog"></div>
    </div>
    <div class="btn-group" style="margin-top:20px">
      <button class="btn btn-cancel" id="progressCancelBtn" onclick="closeProgressDialog()">后台运行</button>
    </div>
  </div>
</div>

<script>
let heroesList = [];
let currentHero = null;
let currentData = null;
let currentTab = 'items';
let currentScope = 'all';
let activeFilters = { tier: new Set(), size: new Set() };
let selectedHeroForDialog = null;
let pollingTimer = null;

const TIER_ORDER = { Bronze:0, Silver:1, Gold:2, Diamond:3, Legendary:4 };
const TIER_ZH = { Bronze:'铜', Silver:'银', Gold:'金', Diamond:'钻石', Legendary:'传说' };
const TIER_ZH_REV = Object.fromEntries(Object.entries(TIER_ZH).map(([k,v])=>[v,k]));
const SIZE_ZH = { Small:'小型', Medium:'中型', Large:'大型' };
const SIZE_ZH_REV = Object.fromEntries(Object.entries(SIZE_ZH).map(([k,v])=>[v,k]));
const SIZE_ORDER = { Small:0, Medium:1, Large:2 };
const TIER_CLASS = { Bronze:'bronze', Silver:'silver', Gold:'gold', Diamond:'diamond', Legendary:'legendary' };
const HERO_COLORS = {'海盗':'#48c6a9','卡诺克':'#cb6c72','杜利':'#6c72cb','匹格梅林':'#cb9b6c','马克':'#6ccbc0','斯特尔':'#c06ccb','朱尔斯':'#6c8fcb','Common':'#888','通用':'#888'};

// ===== Hero List =====
async function loadHeroes() {
  try {
    const resp = await fetch('/api/heroes');
    heroesList = await resp.json();
    renderHeroGrid();
  } catch (e) {
    document.getElementById('heroGrid').innerHTML = '<div class="empty"><div class="icon">⚠️</div><h3>无法加载职业列表</h3><p>请确保服务器正在运行</p></div>';
  }
}

function renderHeroGrid() {
  const grid = document.getElementById('heroGrid');
  if (!heroesList.length) {
    grid.innerHTML = '<div class="empty"><div class="icon">📭</div><h3>暂无职业数据</h3></div>';
    return;
  }
  grid.innerHTML = heroesList.map(h => `
    <div class="hero-card" onclick="onHeroClick('${h.name_en}')">
      <div class="name-zh">${h.name_zh}</div>
      <div class="name-en">${h.name_en}</div>
      <div class="cache-info ${h.has_cache ? '' : 'no-cache'}">
        ${h.has_cache ? '✓ 有本地缓存 (' + h.cache_time + ')' : '⬇ 无缓存，需在线获取'}
      </div>
    </div>
  `).join('');
}

function onHeroClick(heroName) {
  selectedHeroForDialog = heroesList.find(h => h.name_en === heroName);
  if (!selectedHeroForDialog) return;

  document.getElementById('dialogHeroName').textContent =
    selectedHeroForDialog.name_zh + ' (' + selectedHeroForDialog.name_en + ')';
  document.getElementById('useCacheBtn').disabled = !selectedHeroForDialog.has_cache;
  document.getElementById('heroDialog').classList.add('active');
}

function closeDialog() {
  document.getElementById('heroDialog').classList.remove('active');
  selectedHeroForDialog = null;
}

// ===== Online Fetch =====
async function startOnlineFetch() {
  const hero = selectedHeroForDialog;
  if (!hero) { closeDialog(); return; }
  closeDialog();
  showProgressDialog(hero);

  try {
    const resp = await fetch(`/api/fetch/${hero.name_en}`);
    const result = await resp.json();
    if (result.error) {
      appendLog('❌ ' + result.error);
      return;
    }
    // Start polling
    startPolling(hero.name_en);
  } catch (e) {
    appendLog('❌ 请求失败: ' + e.message);
  }
}

function showProgressDialog(hero) {
  document.getElementById('progressHeroName').textContent = hero.name_zh + ' (' + hero.name_en + ')';
  document.getElementById('progressTitle').textContent = '正在获取数据';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = '准备中...';
  document.getElementById('progressPhase').textContent = '';
  document.getElementById('progressLog').innerHTML = '';
  document.getElementById('progressCancelBtn').textContent = '后台运行';
  document.getElementById('progressDialog').classList.add('active');
}

function closeProgressDialog() {
  document.getElementById('progressDialog').classList.remove('active');
  // Keep polling in background
}

function startPolling(heroName) {
  if (pollingTimer) clearInterval(pollingTimer);
  pollingTimer = setInterval(() => pollStatus(heroName), 1000);
}

async function pollStatus(heroName) {
  try {
    const resp = await fetch(`/api/status/${heroName}`);
    const status = await resp.json();

    document.getElementById('progressText').textContent = status.progress || '';
    document.getElementById('progressPhase').textContent =
      status.phase === 'items' ? '📦 获取物品中...' :
      status.phase === 'skills' ? '⚡ 获取技能中...' : '';

    appendLog(status.progress || '');

    // Estimate progress bar
    let pct = 0;
    if (status.phase === 'items') {
      pct = Math.min(45, (status.items_fetched || 0) * 2);
    } else if (status.phase === 'skills') {
      pct = 50 + Math.min(45, (status.skills_fetched || 0) * 3);
    }
    if (status.status === 'done') pct = 100;
    document.getElementById('progressBar').style.width = pct + '%';

    if (status.status === 'done') {
      clearInterval(pollingTimer);
      pollingTimer = null;
      appendLog('✅ 获取完成！');
      document.getElementById('progressTitle').textContent = '获取完成！';
      document.getElementById('progressCancelBtn').textContent = '关闭';

      // Load result
      await loadResult(heroName);
    } else if (status.status === 'error') {
      clearInterval(pollingTimer);
      pollingTimer = null;
      appendLog('❌ 获取失败: ' + (status.error || '未知错误'));
      document.getElementById('progressTitle').textContent = '获取失败';
    }
  } catch (e) {
    // ignore polling errors
  }
}

async function loadResult(heroName) {
  try {
    const resp = await fetch(`/api/result/${heroName}`);
    const data = await resp.json();
    if (data.error) {
      appendLog('❌ ' + data.error);
      return;
    }
    currentHero = heroesList.find(h => h.name_en === heroName);
    currentData = data;
    showContentArea('在线获取 (全部数据)');
    closeProgressDialog();
  } catch (e) {
    appendLog('❌ 加载结果失败: ' + e.message);
  }
}

// ===== Cache =====
async function useCacheData() {
  const hero = selectedHeroForDialog;
  if (!hero) { closeDialog(); return; }
  closeDialog();
  try {
    const resp = await fetch(`/api/hero/${hero.name_en}`);
    const data = await resp.json();
    if (data.error) {
      alert(data.error);
      return;
    }
    currentHero = hero;
    currentData = data;
    showContentArea('本地缓存 (' + (data['获取时间'] || '') + ')');
  } catch (e) {
    alert('加载缓存失败: ' + e.message);
  }
}

// ===== Content Display =====
function showContentArea(source) {
  document.getElementById('heroSelector').style.display = 'none';
  document.getElementById('contentArea').classList.add('active');
  document.getElementById('dataSource').textContent = '数据来源: ' + source;
  updateCounts();
  applyFilters();
}

function showHeroSelector() {
  document.getElementById('heroSelector').style.display = 'block';
  document.getElementById('contentArea').classList.remove('active');
  currentHero = null;
  currentData = null;
  loadHeroes(); // refresh
}

function refetchCurrent() {
  if (!currentHero) return;
  selectedHeroForDialog = currentHero;
  startOnlineFetch();
}

function updateCounts() {
  if (!currentData) return;
  document.getElementById('itemsCount').textContent = (currentData['物品'] || []).length;
  document.getElementById('skillsCount').textContent = (currentData['技能'] || []).length;
}

// ===== Filters =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  applyFilters();
}
function setScope(scope) {
  currentScope = scope;
  document.getElementById('scopeAll').classList.toggle('active', scope === 'all');
  document.getElementById('scopeExclusive').classList.toggle('active', scope === 'exclusive');
  applyFilters();
}
function toggleFilter(btn, type) {
  btn.classList.toggle('active');
  const val = type === 'tier' ? btn.dataset.tier : btn.dataset.size;
  activeFilters[type].has(val) ? activeFilters[type].delete(val) : activeFilters[type].add(val);
  applyFilters();
}

function applyFilters() {
  if (!currentData) return;
  const cards = getCards().filter(matchFilters);
  const sorted = sortCards(cards);
  renderCards(sorted);
}

function getCards() {
  return currentData[currentTab === 'items' ? '物品' : '技能'] || [];
}
function f(card, ...keys) {
  for (const k of keys) if (card[k] != null && card[k] !== '') return card[k];
  return '';
}
function normTier(v) { return TIER_ZH_REV[v] || v; }
function normSize(v) { return SIZE_ZH_REV[v] || v; }

function matchFilters(card) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  if (currentScope === 'exclusive') {
    const heroes = f(card, '所属职业', 'heroes') || [];
    const heroEn = currentData['英文名'] || '';
    const heroZh = currentData['职业'] || '';
    if (!Array.isArray(heroes) || !heroes.some(h => h === heroEn || h === heroZh)) return false;
  }
  if (search) {
    const hay = [
      f(card,'名称','name'), f(card,'英文名','name_en'),
      (f(card,'显示标签','tags')||[]).join(' '),
      (f(card,'效果说明','tooltips')||[]).map(t => typeof t==='object' ? (t.text||'') : t).join(' ')
    ].join(' ').toLowerCase();
    if (!hay.includes(search)) return false;
  }
  if (activeFilters.tier.size) {
    const raw = f(card,'基础品质','base_tier');
    if (!activeFilters.tier.has(raw) && !activeFilters.tier.has(normTier(raw))) return false;
  }
  if (activeFilters.size.size) {
    const raw = f(card,'大小','size');
    if (!activeFilters.size.has(raw) && !activeFilters.size.has(normSize(raw))) return false;
  }
  return true;
}

function sortCards(cards) {
  const sortBy = document.getElementById('sortSelect').value;
  return [...cards].sort((a,b) => {
    if (sortBy === 'name') return f(a,'名称','name').localeCompare(f(b,'名称','name'));
    if (sortBy === 'tier') return (TIER_ORDER[normTier(f(a,'基础品质'))]??99) - (TIER_ORDER[normTier(f(b,'基础品质'))]??99);
    if (sortBy === 'size') return (SIZE_ORDER[normSize(f(a,'大小'))]??99) - (SIZE_ORDER[normSize(f(b,'大小'))]??99);
    return 0;
  });
}

function renderCards(cards) {
  const grid = document.getElementById('cardsGrid');
  const all = getCards();
  const tierS = {}, sizeS = {};
  cards.forEach(c => { const t=f(c,'基础品质'); tierS[t]=(tierS[t]||0)+1; const s=f(c,'大小'); sizeS[s]=(sizeS[s]||0)+1; });
  const tStr = Object.entries(tierS).map(([k,v])=>`${TIER_ZH[k]||k}:${v}`).join('  ');
  const sStr = Object.entries(sizeS).map(([k,v])=>`${SIZE_ZH[k]||k}:${v}`).join('  ');
  document.getElementById('statsBar').innerHTML =
    `显示 ${cards.length}/${all.length} 个${currentTab==='items'?'物品':'技能'}${tStr?' · '+tStr:''}${sStr?' · '+sStr:''}`;

  if (!cards.length) {
    grid.innerHTML = '<div class="empty"><div class="icon">🔍</div><h3>没有匹配的结果</h3><p>请调整筛选条件</p></div>';
    return;
  }

  grid.innerHTML = cards.map(card => {
    const name = f(card,'名称','name'), nameEn = f(card,'英文名','name_en');
    const tier = f(card,'基础品质'), tierZh = TIER_ZH[tier]||tier;
    const size = f(card,'大小'), sizeZh = SIZE_ZH[size]||size;
    const type = f(card,'类型','type');
    const heroes = f(card,'所属职业','heroes_zh','heroes') || [];
    const heroesArr = Array.isArray(heroes) ? heroes : [heroes];
    const tags = f(card,'显示标签','tags') || [];
    const attrs = f(card,'基础属性') || {};
    const link = f(card,'详情链接','uri');
    const fullLink = link && !link.startsWith('http') ? 'https://bazaardb.gg'+link : link;
    const tooltips = f(card,'效果说明','tooltips') || [];
    const tooltipHtml = tooltips.map(t => {
      const text = typeof t==='object' ? (t.text||'') : t;
      const tipType = typeof t==='object' ? (t.type||'') : '';
      return text ? `<div><span class="tip-type">${tipType}</span>${text}</div>` : '';
    }).join('');
    const attrHtml = Object.entries(attrs).slice(0,6).map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('');
    const tierCls = TIER_CLASS[normTier(tier)] || '';
    const heroTagsHtml = heroesArr.map(h => `<span class="hero-tag" style="background:${HERO_COLORS[h]||'#555'}33;color:${HERO_COLORS[h]||'#999'};border:1px solid ${HERO_COLORS[h]||'#555'}55">${h}</span>`).join('');

    return `<div class="card">
      ${fullLink ? `<a class="card-link" href="${fullLink}" target="_blank" title="在 bazaardb.gg 查看">↗</a>` : ''}
      <div class="card-header">
        <div class="card-name">${name}${nameEn && nameEn!==name ? `<small>${nameEn}</small>` : ''}</div>
        <div class="card-badges">
          ${tier ? `<span class="badge badge-tier ${tierCls}">${tierZh}</span>` : ''}
          ${size && currentTab==='items' ? `<span class="badge badge-size">${sizeZh}</span>` : ''}
          ${type ? `<span class="badge badge-type">${type==='Item'?'物品':type==='Skill'?'技能':type}</span>` : ''}
        </div>
      </div>
      ${heroTagsHtml ? `<div class="card-heroes">${heroTagsHtml}</div>` : ''}
      ${tooltipHtml ? `<div class="card-tooltip">${tooltipHtml}</div>` : ''}
      ${attrHtml ? `<div class="card-attrs">${attrHtml}</div>` : ''}
      ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function appendLog(msg) {
  const log = document.getElementById('progressLog');
  if (!msg) return;
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    const si = document.getElementById('searchInput');
    if (si) si.focus();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('heroDialog').classList.contains('active')) { closeDialog(); return; }
    const si = document.getElementById('searchInput');
    if (si) { si.value = ''; applyFilters(); }
  }
});

loadHeroes();
</script>
</body>
</html>
