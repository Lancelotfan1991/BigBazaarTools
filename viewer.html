<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大巴扎数据查看器 - BazaarDB Viewer</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3348;
  --text: #e4e6f0; --text2: #9499b3; --accent: #6c72cb; --accent2: #48c6a9;
  --bronze: #cd7f32; --silver: #c0c0c0; --gold: #ffd700; --diamond: #b9f2ff; --legendary: #ff6b6b;
  --small: #48c6a9; --medium: #6c72cb; --large: #cb6c72;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; line-height:1.6; min-height:100vh; }

/* Header */
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 24px; position:sticky; top:0; z-index:100; }
.header h1 { font-size:20px; font-weight:600; display:flex; align-items:center; gap:10px; }
.header h1 .icon { font-size:24px; }
.header-info { display:flex; align-items:center; gap:16px; margin-top:8px; font-size:13px; color:var(--text2); flex-wrap:wrap; }
.header-info .tag { background:var(--surface2); padding:2px 10px; border-radius:12px; border:1px solid var(--border); }

/* Filters */
.filters { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; position:sticky; top:56px; z-index:99; }
.search-box { flex:1; min-width:200px; position:relative; }
.search-box input { width:100%; padding:8px 12px 8px 36px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.search-box input:focus { border-color:var(--accent); }
.search-box::before { content:'🔍'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:14px; }
.filter-btn { padding:6px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text2); cursor:pointer; font-size:13px; transition:all .2s; white-space:nowrap; }
.filter-btn:hover { border-color:var(--accent); color:var(--text); }
.filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.filter-group { display:flex; gap:4px; flex-wrap:wrap; }
.filter-label { font-size:12px; color:var(--text2); margin-right:4px; align-self:center; }
.stats-bar { padding:8px 24px; background:var(--bg); font-size:13px; color:var(--text2); display:flex; gap:16px; border-bottom:1px solid var(--border); }

/* Tabs */
.tabs { display:flex; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--border); }
.tab { padding:10px 24px; cursor:pointer; font-size:14px; font-weight:500; color:var(--text2); border-bottom:2px solid transparent; transition:all .2s; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent2); border-bottom-color:var(--accent2); }
.tab .count { font-size:11px; background:var(--surface2); padding:1px 7px; border-radius:10px; margin-left:6px; }

/* Cards Grid */
.cards-container { padding:16px 24px; }
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
.card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 20px rgba(108,114,203,.15); }
.card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
.card-name { font-size:15px; font-weight:600; line-height:1.3; }
.card-name small { display:block; font-weight:400; color:var(--text2); font-size:12px; margin-top:2px; }
.card-badges { display:flex; gap:4px; flex-wrap:wrap; }
.badge { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; }
.badge-tier { color:#fff; }
.badge-tier.bronze { background:var(--bronze); } .badge-tier.silver { background:#808080; } .badge-tier.gold { background:#b8960f; } .badge-tier.diamond { background:#4a9eb5; } .badge-tier.legendary { background:var(--legendary); }
.badge-size { background:var(--surface2); border:1px solid var(--border); }
.badge-type { background:var(--surface2); border:1px solid var(--border); color:var(--accent2); }
.card-desc { font-size:13px; color:var(--text2); margin:6px 0; }
.card-tooltip { font-size:12px; color:var(--accent2); line-height:1.5; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
.card-tooltip .tip-type { font-size:10px; color:var(--text2); text-transform:uppercase; margin-right:4px; }
.card-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.card-tag { font-size:10px; padding:1px 6px; border-radius:4px; background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.card-attrs { display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; font-size:11px; color:var(--text2); margin-top:6px; }
.card-attrs span b { color:var(--text); font-weight:500; }
.card-heroes { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.hero-tag { font-size:10px; padding:1px 6px; border-radius:4px; }
.card-link { position:absolute; top:8px; right:8px; color:var(--text2); text-decoration:none; font-size:12px; opacity:0; transition:opacity .2s; }
.card:hover .card-link { opacity:1; }

/* Empty & Loading */
.empty { text-align:center; padding:60px 20px; color:var(--text2); }
.empty .big-icon { font-size:48px; margin-bottom:16px; }
.empty h3 { font-size:18px; margin-bottom:8px; color:var(--text); }
.loading { text-align:center; padding:60px; color:var(--text2); }
.spinner { display:inline-block; width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Sort */
.sort-select { padding:6px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; outline:none; }

/* Responsive */
@media(max-width:768px) {
  .filters { padding:8px 12px; }
  .cards-container { padding:8px 12px; }
  .cards-grid { grid-template-columns:1fr; }
  .header { padding:12px 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span class="icon">🏴‍☠️</span> 大巴扎数据查看器 <span style="font-size:13px;color:var(--text2);font-weight:400">BazaarDB Viewer</span></h1>
  <div class="header-info" id="headerInfo">
    <span>加载中...</span>
  </div>
</div>

<div class="filters" id="filters">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索物品/技能名称、标签..." oninput="applyFilters()">
  </div>
  <span class="filter-label">范围</span>
  <div class="filter-group">
    <button class="filter-btn active" id="scopeAll" onclick="setScope('all')">全部</button>
    <button class="filter-btn" id="scopeExclusive" onclick="setScope('exclusive')">仅专属</button>
  </div>
  <span class="filter-label">品质</span>
  <div class="filter-group" id="tierFilters">
    <button class="filter-btn" data-tier="铜" onclick="toggleFilter(this,'tier')">铜</button>
    <button class="filter-btn" data-tier="银" onclick="toggleFilter(this,'tier')">银</button>
    <button class="filter-btn" data-tier="金" onclick="toggleFilter(this,'tier')">金</button>
    <button class="filter-btn" data-tier="钻石" onclick="toggleFilter(this,'tier')">钻石</button>
    <button class="filter-btn" data-tier="传说" onclick="toggleFilter(this,'tier')">传说</button>
  </div>
  <span class="filter-label">大小</span>
  <div class="filter-group" id="sizeFilters">
    <button class="filter-btn" data-size="小型" onclick="toggleFilter(this,'size')">小型</button>
    <button class="filter-btn" data-size="中型" onclick="toggleFilter(this,'size')">中型</button>
    <button class="filter-btn" data-size="大型" onclick="toggleFilter(this,'size')">大型</button>
  </div>
  <select class="sort-select" id="sortSelect" onchange="applyFilters()">
    <option value="name">按名称</option>
    <option value="tier">按品质</option>
    <option value="size">按大小</option>
  </select>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="items" onclick="switchTab('items')">物品 <span class="count" id="itemsCount">0</span></div>
  <div class="tab" data-tab="skills" onclick="switchTab('skills')">技能 <span class="count" id="skillsCount">0</span></div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="cards-container">
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<script>
let allData = null;
let currentTab = 'items';
let currentScope = 'all'; // 'all' | 'exclusive'
let activeFilters = { tier: new Set(), size: new Set() };

const TIER_ORDER = { Bronze:0, Silver:1, Gold:2, Diamond:3, Legendary:4 };
const TIER_ZH = { Bronze:'铜', Silver:'银', Gold:'金', Diamond:'钻石', Legendary:'传说' };
const TIER_ZH_REV = Object.fromEntries(Object.entries(TIER_ZH).map(([k,v])=>[v,k]));
const SIZE_ZH = { Small:'小型', Medium:'中型', Large:'大型' };
const SIZE_ZH_REV = Object.fromEntries(Object.entries(SIZE_ZH).map(([k,v])=>[v,k]));
const SIZE_ORDER = { Small:0, Medium:1, Large:2 };
const TIER_CLASS = { Bronze:'bronze', Silver:'silver', Gold:'gold', Diamond:'diamond', Legendary:'legendary' };

function setScope(scope) {
  currentScope = scope;
  document.getElementById('scopeAll').classList.toggle('active', scope === 'all');
  document.getElementById('scopeExclusive').classList.toggle('active', scope === 'exclusive');
  applyFilters();
}

async function loadData() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在加载数据...</p></div>';

  try {
    // Try server API first
    let resp = await fetch('/api/data');
    if (resp.ok) {
      allData = await resp.json();
    } else {
      throw new Error('API failed');
    }
  } catch {
    // Fallback: let user pick a file
    grid.innerHTML = `
      <div class="empty">
        <div class="big-icon">📂</div>
        <h3>请加载数据文件</h3>
        <p style="margin-bottom:16px">未检测到服务器数据，请选择本地 JSON 文件加载</p>
        <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(this)" style="color:var(--text2)">
        <p style="margin-top:12px;font-size:12px">提示：运行 <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">python main.py</code> 获取数据后，再运行 <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">python serve.py</code> 启动服务器可自动加载</p>
      </div>`;
    return;
  }

  if (allData.error) {
    grid.innerHTML = `
      <div class="empty">
        <div class="big-icon">⚠️</div>
        <h3>${allData.error}</h3>
        <p style="margin-top:8px">请先运行 <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">python main.py</code> 获取数据</p>
      </div>`;
    return;
  }

  renderHeader();
  renderCards();
}

function loadFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    allData = JSON.parse(e.target.result);
    renderHeader();
    renderCards();
  };
  reader.readAsText(file);
}

function renderHeader() {
  const info = document.getElementById('headerInfo');
  const items = allData['物品'] || allData['items'] || [];
  const skills = allData['技能'] || allData['skills'] || [];
  info.innerHTML = `
    <span class="tag">职业: ${allData['职业'] || allData['hero_zh'] || '未知'}</span>
    <span class="tag">英文名: ${allData['英文名'] || allData['hero'] || '-'}</span>
    <span class="tag">物品: ${items.length}</span>
    <span class="tag">技能: ${skills.length}</span>
    <span class="tag">获取时间: ${allData['获取时间'] || '-'}</span>
  `;
  document.getElementById('itemsCount').textContent = items.length;
  document.getElementById('skillsCount').textContent = skills.length;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  applyFilters();
}

function toggleFilter(btn, type) {
  btn.classList.toggle('active');
  const val = type === 'tier' ? btn.dataset.tier : btn.dataset.size;
  if (activeFilters[type].has(val)) {
    activeFilters[type].delete(val);
  } else {
    activeFilters[type].add(val);
  }
  applyFilters();
}

function applyFilters() {
  renderCards();
}

function getCards() {
  if (!allData) return [];
  const key = currentTab === 'items' ? '物品' : '技能';
  return allData[key] || allData[currentTab] || [];
}

function getCardField(card, ...keys) {
  for (const k of keys) {
    if (card[k] !== undefined && card[k] !== null && card[k] !== '') return card[k];
  }
  return '';
}

function normalizeTier(val) {
  // 输入可能是中文或英文，统一返回英文
  return TIER_ZH_REV[val] || val;
}
function normalizeSize(val) {
  return SIZE_ZH_REV[val] || val;
}

function matchFilters(card) {
  const search = document.getElementById('searchInput').value.toLowerCase();

  // Scope filter: exclusive only shows hero-specific items
  if (currentScope === 'exclusive') {
    const heroes = getCardField(card, '所属职业', 'heroes_zh', 'heroes') || [];
    const heroEn = allData['英文名'] || allData['hero'] || '';
    const heroZh = allData['职业'] || allData['hero_zh'] || '';
    const hasHero = Array.isArray(heroes) && heroes.some(h => h === heroEn || h === heroZh);
    if (!hasHero) return false;
  }

  // Search filter
  if (search) {
    const name = getCardField(card, '名称', 'name').toLowerCase();
    const nameEn = getCardField(card, '英文名', 'name_en').toLowerCase();
    const tags = (getCardField(card, '显示标签', 'display_tags') || []).join(' ').toLowerCase();
    const tags2 = (getCardField(card, 'tags') || []).join(' ').toLowerCase();
    const tooltips = (getCardField(card, '效果说明', 'tooltips') || []);
    const tooltipText = tooltips.map(t => typeof t === 'object' ? t.text || '' : t).join(' ').toLowerCase();
    const haystack = `${name} ${nameEn} ${tags} ${tags2} ${tooltipText}`;
    if (!haystack.includes(search)) return false;
  }

  // Tier filter (supports both Chinese and English tier values)
  if (activeFilters.tier.size > 0) {
    const raw = getCardField(card, '基础品质', 'base_tier');
    const normTier = normalizeTier(raw);
    if (!activeFilters.tier.has(raw) && !activeFilters.tier.has(normTier)) return false;
  }

  // Size filter
  if (activeFilters.size.size > 0) {
    const raw = getCardField(card, '大小', 'size');
    const normSize = normalizeSize(raw);
    if (!activeFilters.size.has(raw) && !activeFilters.size.has(normSize)) return false;
  }

  return true;
}

function sortCards(cards) {
  const sortBy = document.getElementById('sortSelect').value;
  return [...cards].sort((a, b) => {
    if (sortBy === 'name') {
      return getCardField(a, '名称', 'name', '英文名', 'name_en').localeCompare(getCardField(b, '名称', 'name', '英文名', 'name_en'));
    } else if (sortBy === 'tier') {
      const ta = TIER_ORDER[normalizeTier(getCardField(a, '基础品质', 'base_tier'))] ?? 99;
      const tb = TIER_ORDER[normalizeTier(getCardField(b, '基础品质', 'base_tier'))] ?? 99;
      return ta - tb;
    } else if (sortBy === 'size') {
      const sa = SIZE_ORDER[normalizeSize(getCardField(a, '大小', 'size'))] ?? 99;
      const sb = SIZE_ORDER[normalizeSize(getCardField(b, '大小', 'size'))] ?? 99;
      return sa - sb;
    }
    return 0;
  });
}

function renderCards() {
  if (!allData) return;

  const allCards = getCards();
  const filtered = sortCards(allCards.filter(matchFilters));
  const grid = document.getElementById('cardsGrid');
  const statsBar = document.getElementById('statsBar');

  // Stats
  const tierStats = {};
  const sizeStats = {};
  filtered.forEach(c => {
    const t = getCardField(c, '基础品质', 'base_tier');
    tierStats[t] = (tierStats[t] || 0) + 1;
    const s = getCardField(c, '大小', 'size');
    sizeStats[s] = (sizeStats[s] || 0) + 1;
  });
  const tierStr = Object.entries(tierStats).map(([k,v]) => `${TIER_ZH[k]||k}:${v}`).join('  ');
  const sizeStr = Object.entries(sizeStats).map(([k,v]) => `${SIZE_ZH[k]||k}:${v}`).join('  ');
  statsBar.innerHTML = `显示 ${filtered.length}/${allCards.length} 个${currentTab === 'items' ? '物品' : '技能'}${tierStr ? ' · '+tierStr : ''}${sizeStr ? ' · '+sizeStr : ''}`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="big-icon">🔍</div><h3>没有匹配的结果</h3><p>请尝试调整筛选条件</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(card => renderCard(card)).join('');
}

function renderCard(card) {
  const name = getCardField(card, '名称', 'name');
  const nameEn = getCardField(card, '英文名', 'name_en');
  const tier = getCardField(card, '基础品质', 'base_tier');
  const tierZh = getCardField(card, 'base_tier_zh') || TIER_ZH[tier] || tier;
  const size = getCardField(card, '大小', 'size');
  const sizeZh = getCardField(card, 'size_zh') || SIZE_ZH[size] || size;
  const type = getCardField(card, '类型', 'type');
  const heroes = getCardField(card, '所属职业', 'heroes_zh', 'heroes') || [];
  const heroesArr = Array.isArray(heroes) ? heroes : [heroes];
  const tags = getCardField(card, '显示标签', 'display_tags') || [];
  const tagsArr = Array.isArray(tags) ? tags : [];
  const attrs = getCardField(card, '基础属性', 'base_attributes') || {};
  const link = getCardField(card, '详情链接', 'uri');
  const fullLink = link && !link.startsWith('http') ? `https://bazaardb.gg${link}` : link;

  const tooltips = getCardField(card, '效果说明', 'tooltips') || [];
  const tooltipHtml = tooltips.map(t => {
    const text = typeof t === 'object' ? t.text || '' : t;
    const tipType = typeof t === 'object' ? t.type || '' : '';
    if (!text) return '';
    return `<div><span class="tip-type">${tipType}</span>${text}</div>`;
  }).join('');

  const attrHtml = Object.entries(attrs).slice(0, 6).map(([k,v]) => `<span>${k}: <b>${v}</b></span>`).join('');

  const tierCls = TIER_CLASS[normalizeTier(tier)] || '';

  const heroColors = {'海盗':'#48c6a9','卡诺克':'#cb6c72','凡妮莎':'#48c6a9','通用':'#888','Common':'#888','杜利':'#6c72cb','匹格梅林':'#cb9b6c','马克':'#6ccbc0','斯特尔':'#c06ccb','Jules':'#6c8fcb'};
  const heroTagsHtml = heroesArr.map(h => `<span class="hero-tag" style="background:${heroColors[h]||'#555'}33;color:${heroColors[h]||'#999'};border:1px solid ${heroColors[h]||'#555'}55">${h}</span>`).join('');

  return `
    <div class="card">
      ${fullLink ? `<a class="card-link" href="${fullLink}" target="_blank" title="在 bazaardb.gg 查看">↗</a>` : ''}
      <div class="card-header">
        <div class="card-name">${name}${nameEn && nameEn !== name ? `<small>${nameEn}</small>` : ''}</div>
        <div class="card-badges">
          ${tier ? `<span class="badge badge-tier ${tierCls}">${tierZh}</span>` : ''}
          ${size && currentTab === 'items' ? `<span class="badge badge-size">${sizeZh}</span>` : ''}
          ${type ? `<span class="badge badge-type">${type === 'Item' ? '物品' : type === 'Skill' ? '技能' : type}</span>` : ''}
        </div>
      </div>
      ${heroTagsHtml ? `<div class="card-heroes">${heroTagsHtml}</div>` : ''}
      ${tooltipHtml ? `<div class="card-tooltip">${tooltipHtml}</div>` : ''}
      ${attrHtml ? `<div class="card-attrs">${attrHtml}</div>` : ''}
      ${tagsArr.length ? `<div class="card-tags">${tagsArr.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>` : ''}
    </div>
  `;
}

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('searchInput').value = '';
    applyFilters();
  }
});

// Init
loadData();
</script>
</body>
</html>
